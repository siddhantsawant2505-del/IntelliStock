name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix client
          npm ci --prefix server

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-pipeline-secret-ci-pipeline-secret-0123456789
          CLIENT_ORIGIN: http://localhost:3000
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/intellistock_ci

      - name: Build client
        run: npm run build

      # Fails the build on any high or critical advisory in either package.
      - name: Dependency audit gate
        run: npm run audit
